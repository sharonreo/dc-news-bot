name: DC News Bot

on:
  schedule:
    - cron: "*/5 * * * *"      # every 5 minutes (GitHub may delay a few minutes)
  workflow_dispatch:            # lets you run it by hand from the Actions tab

permissions:
  contents: write               # needed to save bot_state.json

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet feedparser requests
      - name: Check news and post to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python forex_news_bot.py --once
      - name: Save what was already posted
        run: |
          git config user.name "dc-news-bot"
          git config user.email "dc-news-bot@users.noreply.github.com"
          git add bot_state.json
          git diff --cached --quiet || git commit -m "update bot state"
          git push
